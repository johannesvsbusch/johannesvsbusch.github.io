# Site configuration. The site is built with plain Hugo (https://gohugo.io), no theme.
baseURL: https://johannesvsbusch.github.io/
title: Johannes V. S. Busch
locale: en
enableRobotsTXT: true

# Only the homepage and the publication pages are built: no tag pages, no RSS feed.
disableKinds: [taxonomy, term, rss]

# Each publication lives at /publication/<folder-name>/
permalinks:
  page:
    publications: /publication/:contentbasename/

params:
  description: The academic homepage of Johannes V. S. Busch.

# Links in the top bar. `#name` jumps to the homepage section with that id (see content/_index.md).
menus:
  main:
    - name: Home
      url: /
      weight: 10
    - name: Publications
      url: /#publications
      weight: 20
    - name: Awards
      url: /#awards
      weight: 30
    - name: Service
      url: /#service
      weight: 40
    - name: Teaching
      url: /#teaching
      weight: 50
    - name: Contact
      url: /#contact
      weight: 60
