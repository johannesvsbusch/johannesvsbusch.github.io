# Markdown is allowed in the bio. Separate paragraphs with an empty line.
bio: |
  I am a PhD student at the [Learning, Adaptive Systems, and Robotics (LASR) Lab](https://lasr.org) at [TU Dresden](https://tu-dresden.de), advised by [Prof. Roberto Calandra](https://robertocalandra.com). I work on diffusion planning for decision making, and I am particularly interested in learning from mixed-quality data, long-horizon planning, and hierarchical models. I apply these planners to robotic manipulation using touch sensing.

  Before joining LASR, I worked with [Prof. Frank Fitzek](https://cn.ifn.et.tu-dresden.de/chair/staff/fitzek) at the [Deutsche Telekom Chair of Communication Networks](https://cn.ifn.et.tu-dresden.de) on reinforcement learning for traffic control and communication networks.

